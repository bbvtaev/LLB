# Fixed project and volume names: the database volume stays the same
# no matter which directory the project is deployed from.
name: llb

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: llb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: the database is only reachable from the bot container.
    # To connect by hand: docker compose exec db psql -U llb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llb -d llb"]
      interval: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://llb:${POSTGRES_PASSWORD}@db:5432/llb?sslmode=disable
      TZ: ${TZ:-Europe/Moscow}

volumes:
  pgdata:
    name: llb_pgdata
